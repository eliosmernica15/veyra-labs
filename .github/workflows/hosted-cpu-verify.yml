name: Hosted CPU verification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/hosted-cpu-verify.yml
      - ml/**
      - scripts/hosted_cpu_verify.py
      - tests/unit/**
      - datasets/source_research_manifest.json

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install CPU-only test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.8.0+cpu"
          python -m pip install pytest tokenizers numpy fastapi httpx

      - name: Download the pinned private artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download veyra004-v5-cpython-v3.14.7-ctx512-20261010 \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/veyra-artifacts"
          echo "7aaee496c5adff3f652a30d67b3bf12dc5438505364ea5a7582a869b43b2110b  $RUNNER_TEMP/veyra-artifacts/checkpoint_final.pt" | sha256sum --check
          echo "47ccdfb870d203c002c65c64e199aeb0ec7b36fc9a91e2826fd2c7d9f0456c4d  $RUNNER_TEMP/veyra-artifacts/tokenizer_veyra004.json" | sha256sum --check
          echo "d2aae57b2953d0e8e10878350f496bd3dff3193d33c7b0af9ed774ad05b00a49  $RUNNER_TEMP/veyra-artifacts/train.pkl" | sha256sum --check
          echo "1106bb2fd22cbfa6325fb52ea34194262d09cf306355b3338e3add88410123c3  $RUNNER_TEMP/veyra-artifacts/val.pkl" | sha256sum --check
          echo "ca7f8c846ae34ac89541dee0761ebb11e63a6e0732ab1e428638e1f10e029891  $RUNNER_TEMP/veyra-artifacts/test.pkl" | sha256sum --check

          mkdir -p checkpoints/veyra004_pretrain_v5 datasets/processed/cpython_docs_3_14_7_v4_ctx512_seed42
          cp "$RUNNER_TEMP/veyra-artifacts/checkpoint_final.pt" checkpoints/veyra004_pretrain_v5/checkpoint_final.pt
          cp "$RUNNER_TEMP/veyra-artifacts/tokenizer_veyra004.json" datasets/processed/tokenizer_veyra004.json
          cp "$RUNNER_TEMP/veyra-artifacts/train.pkl" datasets/processed/cpython_docs_3_14_7_v4_ctx512_seed42/train.pkl
          cp "$RUNNER_TEMP/veyra-artifacts/val.pkl" datasets/processed/cpython_docs_3_14_7_v4_ctx512_seed42/val.pkl
          cp "$RUNNER_TEMP/veyra-artifacts/test.pkl" datasets/processed/cpython_docs_3_14_7_v4_ctx512_seed42/test.pkl

      - name: Run Stage B/C regression tests
        run: |
          python -m pytest tests/unit/test_stage_b_c_data.py tests/unit/test_training_validation.py -q

      - name: Verify baseline validation and fixed prompts
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m scripts.hosted_cpu_verify \
            --checkpoint checkpoints/veyra004_pretrain_v5/checkpoint_final.pt \
            --tokenizer datasets/processed/tokenizer_veyra004.json \
            --validation datasets/processed/cpython_docs_3_14_7_v4_ctx512_seed42/val.pkl \
            --output "$RUNNER_TEMP/veyra-hosted-baseline.json"
          cat "$RUNNER_TEMP/veyra-hosted-baseline.json"
